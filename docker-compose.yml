services:
  postgres:
    image: postgres:16-alpine
    container_name: sv_productos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sv_productos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - sv_productos_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  sv_productos_data:
